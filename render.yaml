services:
  # Option 1: Unified Full-Stack Service (Frontend + Backend + API on Render in 1 single URL)
  - type: web
    name: jobtrack
    env: node
    plan: free
    buildCommand: npm run install:all && npm run frontend:build
    startCommand: npm run backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
